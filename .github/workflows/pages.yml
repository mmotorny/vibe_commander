# The web page as a static site on GitHub Pages, the piece W3c of step 7
# (CLAUDE.md, "The web page"; TODO.md, "W3c"): the page whose drive
# starts from what is served with it at every load and whose changes last
# until the page is closed. It builds the target portable_c-web-static
# with Emscripten, the pinned download of CMakeLists.txt, and deploys
# build/portable_c/web/static, the page and the tree of its drive, C:
# with its directory vc alone.
#
# It never runs by itself. Publishing is the user's to decide (CLAUDE.md,
# "The web page"), so the workflow has no trigger but a run
# asked for by hand, and that run does nothing unless the repository's
# variable VC_PAGES is `publish`; GitHub Pages has to be switched on for
# the repository, with GitHub Actions as its source, besides.
#
# The actions are GitHub's own, each pinned by the commit of its tag, each
# of a release that runs on Node 24 (upload-pages-artifact by
# upload-artifact v7, which does), so that a run has no warning of the
# Node 20 that GitHub has deprecated.

name: Web page on GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.VC_PAGES == 'publish' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Emscripten unpacked, kept between runs by the line of
      # CMakeLists.txt that pins it, URL and SHA-256: a run whose pin is
      # another fetches it again, and the build checks its SHA-256 then.
      - name: The pin of Emscripten
        id: pin
        run: |
          pin=$(grep -A1 'emscripten-releases-builds' CMakeLists.txt | sha256sum | cut -c1-16)
          echo "emscripten=$pin" >> "$GITHUB_OUTPUT"
      - name: Emscripten from the cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/emscripten-src
            build/emscripten/cache
          key: emscripten-${{ steps.pin.outputs.emscripten }}

      # The font fetched by curl, from the URL of CMakeLists.txt and held
      # to its SHA-256 there: CMake's own download of it came back cut
      # short on GitHub's runners, another file at each of its tries,
      # where curl gets the pinned bytes.
      - name: The font
        run: |
          url=$(grep -A2 'FetchContent_Declare(vga_font' CMakeLists.txt | sed -n 's/^ *URL \(.*\)$/\1/p')
          sum=$(grep -A2 'FetchContent_Declare(vga_font' CMakeLists.txt | sed -n 's/^ *URL_HASH SHA256=\(.*\))$/\1/p')
          # The host has also sent other bytes to curl at times: the
          # download is tried again until it is the pinned one.
          for try in 1 2 3 4 5 6; do
            curl -fsSL --retry 3 -o ~/vga_font.zip "$url" || true
            if echo "$sum  $HOME/vga_font.zip" | sha256sum -c --quiet; then
              break
            fi
            echo "try $try: $(stat -c %s ~/vga_font.zip 2>/dev/null) bytes, not the pinned ones"
            if [ "$try" = 6 ]; then
              exit 1
            fi
            sleep 20
          done
          mkdir ~/vga_font-src && unzip -q ~/vga_font.zip -d ~/vga_font-src

      - name: Configure
        run: |
          if [ -d ~/emscripten-src/emscripten ]; then
            from="-DFETCHCONTENT_SOURCE_DIR_EMSCRIPTEN=$HOME/emscripten-src"
          fi
          cmake -S . -B build -DVC_DOS=OFF -DVC_WEB=ON $from \
            -DFETCHCONTENT_SOURCE_DIR_VGA_FONT=$HOME/vga_font-src
      - name: Keep Emscripten for the next run
        if: steps.cache.outputs.cache-hit != 'true'
        run: cp -a build/_deps/emscripten-src ~/emscripten-src
      - name: Build the static page
        run: cmake --build build --target portable_c-web-static -j4

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/portable_c/web/static
          include-hidden-files: true

  deploy:
    if: ${{ vars.VC_PAGES == 'publish' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
